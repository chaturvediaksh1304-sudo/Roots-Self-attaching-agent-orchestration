[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roots"
version = "0.1.0"
description = "Self-attaching agent orchestration system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
roots = "roots.cli:cli"

[tool.setuptools.packages.find]
include = ["roots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
